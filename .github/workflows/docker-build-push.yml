name: Build and Push Images

# Builds ghcr.io/oeasenet/gha-docker-runner/{controller,runner} for
# linux/amd64 and linux/arm64 and pushes them to GHCR.
#   push to main  -> latest, main, sha-<commit>
#   tag vX.Y.Z    -> X.Y.Z, X.Y
#   manual        -> same, optionally with a specific actions/runner version
# Tests are run locally with `make test`.

on:
    push:
        branches: [ main ]
        tags: [ 'v*.*.*' ]
    workflow_dispatch:
        inputs:
            runner_version:
                description: 'actions/runner version to build (blank = latest release)'
                required: false
                default: ''

permissions:
    contents: read
    packages: write

env:
    IMAGE_BASE: ghcr.io/${{ github.repository }}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: ${{ matrix.image }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                image: [ controller, runner ]
        steps:
            -   uses: actions/checkout@v7

            -   name: Resolve actions/runner version
                id: runner
                env:
                    GH_TOKEN: ${{ github.token }}
                    REQUESTED: ${{ inputs.runner_version }}
                run: |
                    if [ -n "$REQUESTED" ]; then
                        version="${REQUESTED#v}"
                    else
                        version=$(gh api repos/actions/runner/releases/latest --jq '.tag_name' | sed 's/^v//')
                    fi
                    echo "version=${version}" >> "$GITHUB_OUTPUT"

            -   uses: docker/setup-qemu-action@v4
            -   uses: docker/setup-buildx-action@v4

            -   uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Image metadata
                id: meta
                uses: docker/metadata-action@v6
                env:
                    DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
                with:
                    images: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
                    tags: |
                        type=ref,event=branch
                        type=semver,pattern={{version}}
                        type=semver,pattern={{major}}.{{minor}}
                        type=sha,prefix=sha-
                        type=raw,value=runner-${{ steps.runner.outputs.version }},enable=${{ matrix.image == 'runner' && github.ref == 'refs/heads/main' }}
                        type=raw,value=latest,enable={{is_default_branch}}
                    labels: |
                        org.opencontainers.image.licenses=Apache-2.0

            -   name: Build and push
                uses: docker/build-push-action@v7
                with:
                    context: ${{ matrix.image }}
                    platforms: linux/amd64,linux/arm64
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    annotations: ${{ steps.meta.outputs.annotations }}
                    build-args: |
                        VERSION=${{ steps.meta.outputs.version }}
                        GITHUB_RUNNER_VERSION=${{ steps.runner.outputs.version }}
                    cache-from: type=gha,scope=${{ matrix.image }}
                    cache-to: type=gha,scope=${{ matrix.image }},mode=max
                    provenance: false
                    sbom: false
