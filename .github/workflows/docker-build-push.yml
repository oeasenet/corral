name: Build and Push Docker Images

on:
    push:
        branches:
            - main
        paths:
            - 'kms/**'
            - 'runner/**'
            - '.github/workflows/docker-build-push.yml'

env:
    REGISTRY: registry.digitalocean.com

jobs:
    build-kms:
        runs-on: self-hosted
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Log in to the Container registry
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ secrets.DOCR_USERNAME }}
                    password: ${{ secrets.DOCR_PASSWORD }}

            -   name: Extract metadata
                id: meta
                uses: docker/metadata-action@v5
                with:
                    images: ${{ env.REGISTRY }}/turix/gha-runner-kms
                    tags: |
                        type=ref,event=branch
                        type=ref,event=pr
                        type=semver,pattern={{version}}
                        type=semver,pattern={{major}}.{{minor}}
                        type=sha,prefix={{branch}}-
                        type=raw,value=latest,enable={{is_default_branch}}

            -   name: Build and push KMS Docker image
                uses: docker/build-push-action@v5
                with:
                    context: ./kms
                    file: ./kms/Dockerfile
                    platforms: linux/amd64
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    cache-from: type=registry,ref=${{ env.REGISTRY }}/turix/gha-runner-kms:buildcache
                    cache-to: type=registry,ref=${{ env.REGISTRY }}/turix/gha-runner-kms:buildcache,mode=max
                    build-args: |
                        VERSION=${{ github.sha }}
                        BUILD_DATE=${{ github.event.head_commit.timestamp }}

    build-runner:
        runs-on: self-hosted
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Log in to the Container registry
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ secrets.DOCR_USERNAME }}
                    password: ${{ secrets.DOCR_PASSWORD }}

            -   name: Extract metadata
                id: meta
                uses: docker/metadata-action@v5
                with:
                    images: ${{ env.REGISTRY }}/turix/gha-runner
                    tags: |
                        type=ref,event=branch
                        type=ref,event=pr
                        type=semver,pattern={{version}}
                        type=semver,pattern={{major}}.{{minor}}
                        type=sha,prefix={{branch}}-
                        type=raw,value=latest,enable={{is_default_branch}}

            -   name: Build and push Runner Docker image
                uses: docker/build-push-action@v5
                with:
                    context: ./runner
                    file: ./runner/Dockerfile
                    platforms: linux/amd64
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    cache-from: type=registry,ref=${{ env.REGISTRY }}/turix/gha-runner:buildcache
                    cache-to: type=registry,ref=${{ env.REGISTRY }}/turix/gha-runner:buildcache,mode=max
                    build-args: |
                        VERSION=${{ github.sha }}
                        BUILD_DATE=${{ github.event.head_commit.timestamp }}