# oease GitHub Actions runners: one controller container manages the runner fleet.
#
#   cp .env.example .env      # fill in GITHUB_PAT and ADMIN_PASSWORD
#   docker compose up -d
#   open http://127.0.0.1:8080  (user: admin)
#
# Everything else (runner count, labels, image, ephemeral…) is changed live in the UI.

services:
    gha-controller:
        image: ghcr.io/oeasenet/gha-docker-runner/controller:${IMAGE_TAG:-latest}
        restart: unless-stopped
        environment:
            - TZ=${TZ:-UTC}
            - GITHUB_OWNER=${GITHUB_OWNER:?set GITHUB_OWNER in .env}
            - GITHUB_PAT=${GITHUB_PAT:?set GITHUB_PAT in .env}
            - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (openssl rand -hex 16)}
            # Initial values only; the UI owns them after the first start.
            - RUNNER_COUNT=${RUNNER_COUNT:-2}
            - RUNNER_LABELS=${RUNNER_LABELS:-}
            - RUNNER_IMAGE=${RUNNER_IMAGE:-ghcr.io/oeasenet/gha-docker-runner/runner:${IMAGE_TAG:-latest}}
            # Needed only while the runner package on GHCR is private.
            - REGISTRY_USERNAME=${REGISTRY_USERNAME:-}
            - REGISTRY_PASSWORD=${REGISTRY_PASSWORD:-}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - gha-data:/data
        ports:
            # Dashboard, bound to localhost by default. Set BIND_ADDR=0.0.0.0 or front it with Traefik.
            - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:8080"
        healthcheck:
            test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8080/health" ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        labels:
            # Safe to auto-update: runners keep working while the controller restarts.
            - com.centurylinklabs.watchtower.enable=true

volumes:
    gha-data:
